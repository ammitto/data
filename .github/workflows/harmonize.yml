name: Harmonize Data

on:
  workflow_dispatch:
  schedule:
    # Run daily at 9:00 AM UTC (after all fetches complete)
    - cron: '0 9 * * *'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/harmonize.yml'

# One publishing run at a time. Two runs racing -- the 09:00 schedule and a
# manual dispatch, say -- would both check for the `latest` release, both try
# to create it, and both push from different checkouts. cancel-in-progress is
# false on purpose: a run that has already uploaded assets must be allowed to
# finish its commit, or the release and the tree stay out of step.
concurrency:
  group: publish-harmonized-data
  cancel-in-progress: false

jobs:
  harmonize:
    name: Harmonize source data to JSON-LD
    runs-on: ubuntu-latest
    # `workflow_dispatch` lets anyone with write access pick a branch, and
    # checkout follows the triggering ref. The release tag, the outage issue
    # and the push are all repository-wide, so a run from a side branch would
    # overwrite production output with that branch's build. The whole job is
    # gated rather than the individual steps: harmonizing is harmless, but
    # there is no reason to spend twenty minutes producing something that must
    # not be published.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Offline fixture proof of the reconciler's state machine, ahead of
      # the work, because a reconciler that silently stopped recognising
      # its own issue would go quiet rather than fail. Costs under a
      # second and makes no API call.
      - name: Self-test the outage reconciler
        id: reconciler_selftest
        run: .github/scripts/harmonize_issue_test.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install ammitto gem from GitHub
        run: |
          gem install specific_install
          gem specific_install https://github.com/ammitto/ammitto.git -b main

      # Checkout all source repos
      - name: Checkout data-uk
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-uk
          path: sources/data-uk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-eu
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-eu
          path: sources/data-eu
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-un
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-un
          path: sources/data-un
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-us
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-us
          path: sources/data-us
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-wb
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-wb
          path: sources/data-wb
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-au
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-au
          path: sources/data-au
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-ca
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-ca
          path: sources/data-ca
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-ch
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-ch
          path: sources/data-ch
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-cn
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-cn
          path: sources/data-cn
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-ru
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-ru
          path: sources/data-ru
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-nz
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-nz
          path: sources/data-nz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-tr
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-tr
          path: sources/data-tr
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-eu-vessels
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-eu-vessels
          path: sources/data-eu-vessels
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-un-vessels
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-un-vessels
          path: sources/data-un-vessels
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-jp
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-jp
          path: sources/data-jp
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Harmonize data
        run: |
          # Create output directory structure
          mkdir -p api/v1/sources
          mkdir -p api/v1/schema

          # ru is named in --allow-empty because it reaches the gate
          # with no entity YAML to read, which is a source-level error,
          # and the gate exits nonzero on it. Every step below is then
          # skipped: a step's `if:` carries an implicit success() unless
          # it spells out always(), failure() or cancelled(), so the
          # has_changes conditions on the commit and the deployment
          # dispatch narrow when those steps run but cannot make them run
          # after a failure. One source with nothing to contribute
          # therefore withholds the publish from every source that does,
          # which is what has held this repository at the 2026-07-22
          # commit.
          #
          # Read the exemption as broad, not surgical: for a named code
          # it also clears the zero-entity, missing-aggregate and
          # quality-floor gates, so a regression there will not be
          # caught. Per-file transform errors are never exempt, for any
          # code.
          #
          # The consequence worth naming: ru's per-source endpoint,
          # api/v1/sources/ru.jsonld, stops being rewritten and keeps
          # SERVING whatever it last held while the rest of the publish
          # resumes around it. The exporter writes that file only when a
          # source produced entities, and the client treats its presence
          # as "this source exists" -- so ru reads as a healthy published
          # source carrying July data, and grows relatively staler every
          # day the others update. all.jsonld, search-index.json and
          # stats.json are rebuilt from the current run and carry no ru
          # rows, so the staleness is confined to that one endpoint.
          # Accepted here because the alternative is publishing nothing
          # at all; removing or suppressing the stale aggregate is its
          # own change.
          #
          # un_vessels tripped the same gate until this morning and is
          # deliberately not named: data-un-vessels#5 stopped .gitignore
          # excluding its processed/ output, and the 06:21 fetch on
          # 2026-08-19 committed 60 vessel files, so it clears the gate
          # on its own. Drop ru the same way, the moment it has input.
          #
          # The report is written outside the working tree on purpose:
          # the commit step below runs `git add .` and would publish it.
          # It is written even when the gates fail, which is the run the
          # reconciler below needs it for.
          ammitto harmonize --all --sources-dir ./sources --output-dir ./api/v1 \
            --combine --verbose --allow-empty ru \
            --report "$RUNNER_TEMP/harmonize-report.json"

      - name: Generate stats
        run: |
          # Generate stats.json with entity counts
          ammitto stats --output ./api/v1/stats.json --verbose || true

      # A producer regression that emitted no catalogue, or only one of the
      # two aggregates, used to reach `Check for changes`, find nothing
      # git-visible, and finish green having published nothing. The gem is
      # installed from moving `main`, so that is a live path, not a
      # hypothetical. Assert what --combine must have produced before any
      # later step is allowed to decide there is nothing to do.
      - name: Check harmonize produced what it must
        run: |
          set -euo pipefail
          for f in api/v1/index.jsonld api/v1/all.jsonld api/v1/all.ttl; do
            test -s "$f" || { echo "::error::harmonize produced no $f"; exit 1; }
          done

      # index.jsonld is the machine-readable catalogue: a consumer reads it
      # to find out what this API publishes and where. The gem builds it
      # from what exists on disk after the export, and --combine leaves
      # both aggregates on disk, so it lists them at relative URLs.
      #
      # Relative is right for the site, which serves its own copy of the
      # aggregates from its Pages artifact. It is wrong here, because this
      # repository now sends them to a release instead. Left alone, the
      # first successful run after this change would publish a catalogue
      # advertising www.ammitto.org/data/api/v1/all.jsonld, which .gitignore
      # guarantees is a 404 -- the exact failure the gem's own comment at
      # json_ld_graph_exporter.rb:433 says the catalogue must never produce.
      #
      # Rewriting here rather than in the gem keeps the site correct: the
      # divergence belongs to this repository's transport, not to the
      # exporter.
      - name: Point the catalogue at the release assets
        run: |
          set -euo pipefail
          python3 - <<'REWRITE'
          import json, sys

          INDEX = 'api/v1/index.jsonld'
          BASE = 'https://github.com/ammitto/data/releases/download/latest/'
          DIVERTED = {'all.jsonld', 'all.ttl'}

          # The preceding step already failed the run if this is missing, so
          # no absent-file branch here: it would be unreachable, and an
          # unreachable branch reads as a case that can happen.
          with open(INDEX, encoding='utf-8') as fh:
              index = json.load(fh)

          entries = index.get('entries', [])
          seen = {e.get('name') for e in entries}
          rewritten = []
          for entry in entries:
              if entry.get('name') in DIVERTED:
                  entry['url'] = BASE + entry['name']
                  rewritten.append(entry['name'])

          missing = DIVERTED - seen
          if missing:
              # --combine ran, so both should be catalogued. If one is not,
              # the export did not produce it and the run must not publish.
              print(f'catalogue is missing {sorted(missing)}', file=sys.stderr)
              sys.exit(1)

          with open(INDEX, 'w', encoding='utf-8') as fh:
              json.dump(index, fh, ensure_ascii=False, indent=2)
              fh.write('\n')
          print('repointed:', ', '.join(sorted(rewritten)))
          REWRITE

      - name: Check for changes
        id: check_changes
        run: |
          set -euo pipefail
          # `git diff` does not see untracked files, but `git add .` stages
          # them. api/v1/index.jsonld is untracked today and appears for
          # the first time on the next successful run, so a harvest whose
          # only change is a new file would have set has_changes=false and
          # skipped the release and the commit both.
          untracked="$(git ls-files --others --exclude-standard)"
          if git diff --quiet && git diff --staged --quiet && [ -z "$untracked" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # ORDER: validate, size-gate and COMMIT LOCALLY first, then upload the
      # assets, then push. An earlier revision uploaded first, reasoning that
      # the committed catalogue points at the assets so committing first opens
      # a 404 window. It does not: a local commit is not public. Uploading
      # first meant a tracked file over the size gate published both assets and
      # only then refused the commit, leaving the release ahead of the tree
      # with no way back.
      - name: Stage and commit the harmonized output
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # This repository published nothing between 2026-08-20 and
          # 2026-09-01 because harmonize succeeded, the push was refused on a
          # file over 100 MB, and nothing said which file. Name it, and fail
          # before anything is published. 90 MB leaves room to act on a file
          # that is still growing.
          #
          # The list is built with a checked command into a file rather than
          # read from a process substitution: `set -e` does not see a failing
          # producer on the right of `<`, so a broken `git ls-files` would have
          # left the loop with nothing to read and the gate passing empty.
          #
          # NUL-delimited so a pathname containing a space or a newline is one
          # record and is printed whole. `git ls-files -c` also lists tracked
          # paths already deleted from disk, which have no size to stat, so
          # skip what is not there: `git add .` stages their deletion.
          git ls-files -co --exclude-standard -z > "$RUNNER_TEMP/staged.nul"

          limit=$((90 * 1024 * 1024))
          oversize=""
          while IFS= read -r -d '' path; do
            [ -f "$path" ] || continue
            size=$(stat -c '%s' -- "$path")
            [ "$size" -gt "$limit" ] || continue
            oversize="${oversize}  ${path} ($((size / 1048576)) MB)"$'\n'
          done < "$RUNNER_TEMP/staged.nul"

          if [ -n "$oversize" ]; then
            echo "refusing to commit: GitHub rejects a push carrying a file over 100 MB" >&2
            printf '%s' "$oversize" >&2
            echo "send it to the release instead, as api/v1/all.jsonld is" >&2
            exit 1
          fi

          git add .
          git commit -m "chore: harmonize sanctions data ($(date +%Y-%m-%d))"

      # The aggregates go to a release, not to git. Ronald ruled on 2026-09-01
      # that all.jsonld is not a contract and that files this large belong in
      # GitHub releases. They are still produced above by --combine;
      # .gitignore keeps `git add .` from staging them, and this step publishes
      # them where GitHub's 100 MB push limit does not apply.
      #
      # One rolling tag rather than one release per day: the harvest runs daily
      # and 149 MB of assets per day is not worth keeping. `--clobber` replaces
      # the assets in place, so the download URL is stable.
      - name: Publish the aggregates as release assets
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # `gh release view || gh release create` would read an expired token,
          # a rate limit or a network fault as "no release yet" and answer it by
          # trying to create one. That fails closed, but it reports the wrong
          # cause. Only a genuine absence may create.
          set +e
          view_err=$(gh release view latest 2>&1 >/dev/null)
          view_rc=$?
          set -e
          if [ "$view_rc" -ne 0 ]; then
            case "$view_err" in
              *"release not found"*|*"Not Found"*|*"HTTP 404"*)
                gh release create latest --title "Latest harmonized graph" \
                  --notes "Whole-graph exports, replaced on every successful harvest. Per-source data lives in api/v1/sources/ in this repository."
                ;;
              *)
                printf 'could not determine whether the release exists:\n%s\n' "$view_err" >&2
                exit 1
                ;;
            esac
          fi

          gh release upload latest api/v1/all.jsonld api/v1/all.ttl --clobber

          # `gh` uploads assets concurrently and deletes each old asset just
          # before writing its replacement, so a fault mid-flight can leave the
          # release holding one harvest's file beside another's. Sizes alone do
          # not catch that -- two different graphs can be the same length --
          # so compare the digests GitHub computed against the bytes just
          # built, from one metadata snapshot.
          snapshot=$(gh release view latest --json assets)
          for asset in all.jsonld all.ttl; do
            built="sha256:$(sha256sum "api/v1/$asset" | cut -d' ' -f1)"
            published=$(printf '%s' "$snapshot" \
              | jq -r --arg n "$asset" '[.assets[] | select(.name == $n) | .digest] | first // "absent"')
            if [ "$published" = "null" ] || [ "$published" = "absent" ]; then
              echo "::error::release asset $asset is missing or reports no digest"
              exit 1
            fi
            if [ "$built" != "$published" ]; then
              echo "::error::release asset $asset is $published, built $built"
              echo "the release holds a different harvest; the commit is local and unpushed" >&2
              exit 1
            fi
          done

      - name: Push the harmonized output
        if: steps.check_changes.outputs.has_changes == 'true'
        run: git push

      - name: Trigger website deployment
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          # AMMITTO_CI_PAT_TOKEN, not DEPLOY_TOKEN: no secret of the
          # latter name exists. This repository has no repository-level
          # secrets at all, and the organization secrets visible to it
          # are AMMITTO_CI_PAT_TOKEN and AMMITTO_CI_RUBYGEMS_API_KEY --
          # both checkable by name through the Actions secrets API,
          # which returns names and never values. An undefined secret
          # resolves to an empty string, and an explicitly empty input
          # suppresses github-script's own default, so its
          # core.getInput('github-token', {required: true}) raises
          # "Input required and not supplied" before the script below is
          # evaluated. The step does fail and the action's own handler
          # logs it; what is missing is any connection to what this step
          # is for. The message names an absent input, not a site that
          # was never rebuilt, and the try/catch further down — which is
          # inside the script — never sees it.
          #
          # Six sibling repos dispatch across repositories: data-uk,
          # data-tr, data-jp, data-nz, data-eu-vessels and
          # data-un-vessels. Every one of them names the secret this
          # way, and this workflow was the seventh dispatcher and the
          # only one still on DEPLOY_TOKEN. That is a census, not a
          # recollection, and it is repeatable: grep every workflow in
          # every ammitto repo for createWorkflowDispatch and read the
          # secrets.* it references. Re-run it before trusting the
          # count; a repo added since will not be in it.
          github-token: ${{ secrets.AMMITTO_CI_PAT_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: 'ammitto',
                repo: 'ammitto.github.io',
                workflow_id: 'deploy.yml',
                ref: 'main'
              });
            } catch (error) {
              // Fails the step rather than logging and carrying on. The
              // empty-token case above is caught by the action before
              // this script runs, but a token that is present and
              // expired, revoked or under-scoped raises HERE, and
              // console.log left the run green: the data was published
              // and the site was never rebuilt, with nothing saying so.
              // Failing makes the run red, and that is the whole signal.
              //
              // It deliberately does NOT reach the reconciler below.
              // That step tracks the harmonization outage and keys on
              // the report harmonize wrote, so a run whose sources were
              // all healthy reads as healthy there however the dispatch
              // went. A dispatch that never fired is a different fault
              // from a source that produced nothing, and folding the
              // two onto one issue is what the reconciler exists to
              // stop.
              core.setFailed('Could not trigger deployment: ' + error.message);
            }

      # One open issue carries the state of the current outage, updated in
      # place and closed on recovery. The step this replaces created one
      # per failing run, which is how 321 open issues accumulated and
      # buried the outage they were reporting.
      #
      # `job.status` is not the input: the reconciler reads the JSON report
      # harmonize wrote, so it can say which sources failed and why rather
      # than only that something did.
      - name: Reconcile the harmonization outage issue
        if: ${{ !cancelled() && steps.reconciler_selftest.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/harmonize_issue.sh \
            "$RUNNER_TEMP/harmonize-report.json" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
