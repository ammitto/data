name: Harmonize Data

on:
  workflow_dispatch:
  schedule:
    # Run daily at 9:00 AM UTC (after all fetches complete)
    - cron: '0 9 * * *'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/harmonize.yml'

# One generation proposal at a time. Accepted releases use a separate
# concurrency group, so a scheduled proposal cannot replace a queued publisher.
concurrency:
  group: harmonize-data-propose
  cancel-in-progress: false

jobs:
  harmonize:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Harmonize source data to JSON-LD
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued event SHA can predate the preceding run's publication.
          # Start generation from the default branch as it exists now.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.AMMITTO_CI_PAT_TOKEN }}

      - name: Verify queued publication checkout
        run: python3 .github/scripts/publish_checkout_test.py

      # Offline fixture proof of the reconciler's state machine, ahead of
      # the work, because a reconciler that silently stopped recognising
      # its own issue would go quiet rather than fail. Costs under a
      # second and makes no API call.
      - name: Self-test the outage reconciler
        id: reconciler_selftest
        run: .github/scripts/harmonize_issue_test.sh

      - name: Self-test publication outage tracking
        id: publication_selftest
        run: python3 .github/scripts/publication_issue_test.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install ammitto gem from GitHub
        run: |
          gem install specific_install
          gem specific_install https://github.com/ammitto/ammitto.git -b main

      # Checkout all source repos
      - name: Checkout data-uk
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-uk
          path: sources/data-uk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-eu
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-eu
          path: sources/data-eu
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-un
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-un
          path: sources/data-un
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-us
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-us
          path: sources/data-us
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-wb
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-wb
          path: sources/data-wb
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-au
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-au
          path: sources/data-au
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-ca
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-ca
          path: sources/data-ca
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-ch
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-ch
          path: sources/data-ch
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-cn
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-cn
          path: sources/data-cn
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-ru
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-ru
          path: sources/data-ru
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-nz
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-nz
          path: sources/data-nz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-tr
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-tr
          path: sources/data-tr
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-eu-vessels
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-eu-vessels
          path: sources/data-eu-vessels
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-un-vessels
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-un-vessels
          path: sources/data-un-vessels
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-jp
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-jp
          path: sources/data-jp
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Harmonize data
        id: harmonize
        run: |
          # Create output directory structure
          mkdir -p api/v1/sources
          mkdir -p api/v1/schema

          # RU now has source-backed processed records. Require it to pass
          # the same empty-input, aggregate and quality gates as every source.
          # The suppression script still checks this run's RU result before
          # publication; no source is exempt from the producer's gates.
          #
          # The report is written outside the working tree on purpose:
          # the commit step below runs `git add .` and would publish it.
          # It is written even when the gates fail, which is the run the
          # reconciler below needs it for.
          #
          # --combine builds the oversized aggregates retained in an immutable
          # artifact. The accepted-data publisher verifies that artifact and
          # releases it only after this generated dataset has been merged.
          # .gitignore
          # keeps the assets, and the catalogue that would advertise them,
          # out of the COMMIT, because GitHub blocks a push introducing a
          # blob over 100 MiB. Full reasoning is in .gitignore.
          #
          # This step also produces api/v1/stats.json, through
          # Serialization::JsonLdGraphExporter#export_stats
          # (json_ld_graph_exporter.rb:1258). A separate "Generate stats"
          # step used to follow, running
          # `ammitto stats --output ... || true`; there is no top-level
          # `stats` command, so it printed "Could not find command" and the
          # `|| true` swallowed it. It reported success while doing nothing
          # for as long as it existed. Do not add it back: `ammitto data
          # stats` is the real command and it PRINTS statistics, it does not
          # write a file and takes no --output.
          ammitto harmonize --all --sources-dir ./sources --output-dir ./api/v1 \
            --combine --verbose \
            --report "$RUNNER_TEMP/harmonize-report.json"

      - name: Self-test RU publication suppression
        run: .github/scripts/suppress_unpublished_ru_test.sh

      - name: Suppress unpublished RU aggregates
        run: .github/scripts/suppress_unpublished_ru.sh "$RUNNER_TEMP/harmonize-report.json" api/v1

      - name: Prepare immutable publication artifact and manifest
        id: prepare_publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLICATION_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python3 .github/scripts/publication_manifest.py prepare
          --artifact-dir "$RUNNER_TEMP/harmonized-aggregates"

      - name: Preserve aggregates for accepted publication
        if: steps.prepare_publication.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_publication.outputs.artifact_name }}
          path: ${{ runner.temp }}/harmonized-aggregates/*
          if-no-files-found: error
          retention-days: 30

      - name: Propose generated data for review
        id: commit_data
        env:
          GH_TOKEN: ${{ secrets.AMMITTO_CI_PAT_TOKEN }}
          PUBLICATION_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python3 .github/scripts/generated_data_pr.py
          --branch automation/harmonized-data
          --title "Update harmonized sanctions data"
          --path api --path sources --path .publication

      # A successful proposal awaits merge; it does not mean publication recovered.
      - name: Reconcile the publication outage issue
        if: >-
          ${{ !cancelled() && github.event_name != 'pull_request' &&
              github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
              steps.publication_selftest.outcome == 'success' && steps.harmonize.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLICATION_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HARMONIZE_OUTCOME: ${{ steps.harmonize.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit_data.outcome }}
          PENDING_PR: ${{ steps.commit_data.outputs.pr_url }}
        run: |
          python3 .github/scripts/publication_issue.py \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --harmonize "$HARMONIZE_OUTCOME" --commit "$COMMIT_OUTCOME" \
            --release skipped --dispatch skipped --phase proposal --pending-pr "$PENDING_PR"

      # One open issue carries the state of the current outage, updated in
      # place and closed on recovery. The step this replaces created one
      # per failing run, which is how 321 open issues accumulated and
      # buried the outage they were reporting.
      #
      # `job.status` is not the input: the reconciler reads the JSON report
      # harmonize wrote, so it can say which sources failed and why rather
      # than only that something did.
      - name: Reconcile the harmonization outage issue
        if: ${{ !cancelled() && steps.reconciler_selftest.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/harmonize_issue.sh \
            "$RUNNER_TEMP/harmonize-report.json" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
