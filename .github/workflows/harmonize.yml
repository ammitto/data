name: Harmonize Data

on:
  workflow_dispatch:
  schedule:
    # Run daily at 9:00 AM UTC (after all fetches complete)
    - cron: '0 9 * * *'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/harmonize.yml'

jobs:
  harmonize:
    name: Harmonize source data to JSON-LD
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Offline fixture proof of the reconciler's state machine, ahead of
      # the work, because a reconciler that silently stopped recognising
      # its own issue would go quiet rather than fail. Costs under a
      # second and makes no API call.
      - name: Self-test the outage reconciler
        id: reconciler_selftest
        run: .github/scripts/harmonize_issue_test.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install ammitto gem from GitHub
        run: |
          gem install specific_install
          gem specific_install https://github.com/ammitto/ammitto.git -b main

      # Checkout all source repos
      - name: Checkout data-uk
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-uk
          path: sources/data-uk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-eu
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-eu
          path: sources/data-eu
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-un
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-un
          path: sources/data-un
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-us
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-us
          path: sources/data-us
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-wb
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-wb
          path: sources/data-wb
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-au
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-au
          path: sources/data-au
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-ca
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-ca
          path: sources/data-ca
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-ch
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-ch
          path: sources/data-ch
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-cn
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-cn
          path: sources/data-cn
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-ru
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-ru
          path: sources/data-ru
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-nz
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-nz
          path: sources/data-nz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-tr
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-tr
          path: sources/data-tr
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-eu-vessels
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-eu-vessels
          path: sources/data-eu-vessels
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-un-vessels
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-un-vessels
          path: sources/data-un-vessels
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-jp
        uses: actions/checkout@v4
        with:
          repository: ammitto/data-jp
          path: sources/data-jp
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Harmonize data
        run: |
          # Create output directory structure
          mkdir -p api/v1/sources
          mkdir -p api/v1/schema

          # ru is named in --allow-empty because it reaches the gate
          # with no entity YAML to read, which is a source-level error,
          # and the gate exits nonzero on it. Every step below is then
          # skipped: a step's `if:` carries an implicit success() unless
          # it spells out always(), failure() or cancelled(), so the
          # has_changes conditions on the commit and the deployment
          # dispatch narrow when those steps run but cannot make them run
          # after a failure. One source with nothing to contribute
          # therefore withholds the publish from every source that does,
          # which is what has held this repository at the 2026-07-22
          # commit.
          #
          # Read the exemption as broad, not surgical: for a named code
          # it also clears the zero-entity, missing-aggregate and
          # quality-floor gates, so a regression there will not be
          # caught. Per-file transform errors are never exempt, for any
          # code.
          #
          # The consequence worth naming: ru's per-source endpoint,
          # api/v1/sources/ru.jsonld, stops being rewritten and keeps
          # SERVING whatever it last held while the rest of the publish
          # resumes around it. The exporter writes that file only when a
          # source produced entities, and the client treats its presence
          # as "this source exists" -- so ru reads as a healthy published
          # source carrying July data, and grows relatively staler every
          # day the others update. all.jsonld, search-index.json and
          # stats.json are rebuilt from the current run and carry no ru
          # rows, so the staleness is confined to that one endpoint.
          # Accepted here because the alternative is publishing nothing
          # at all; removing or suppressing the stale aggregate is its
          # own change.
          #
          # un_vessels tripped the same gate until this morning and is
          # deliberately not named: data-un-vessels#5 stopped .gitignore
          # excluding its processed/ output, and the 06:21 fetch on
          # 2026-08-19 committed 60 vessel files, so it clears the gate
          # on its own. Drop ru the same way, the moment it has input.
          #
          # The report is written outside the working tree on purpose:
          # the commit step below runs `git add .` and would publish it.
          # It is written even when the gates fail, which is the run the
          # reconciler below needs it for.
          ammitto harmonize --all --sources-dir ./sources --output-dir ./api/v1 \
            --combine --verbose --allow-empty ru \
            --report "$RUNNER_TEMP/harmonize-report.json"

      - name: Generate stats
        run: |
          # Generate stats.json with entity counts
          ammitto stats --output ./api/v1/stats.json --verbose || true

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: harmonize sanctions data ($(date +%Y-%m-%d))"
          git push

      - name: Trigger website deployment
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          # AMMITTO_CI_PAT_TOKEN, not DEPLOY_TOKEN: no secret of the
          # latter name exists. This repository has no repository-level
          # secrets at all, and the organization secrets visible to it
          # are AMMITTO_CI_PAT_TOKEN and AMMITTO_CI_RUBYGEMS_API_KEY --
          # both checkable by name through the Actions secrets API,
          # which returns names and never values. An undefined secret
          # resolves to an empty string, and an explicitly empty input
          # suppresses github-script's own default, so its
          # core.getInput('github-token', {required: true}) raises
          # "Input required and not supplied" before the script below is
          # evaluated. The step does fail and the action's own handler
          # logs it; what is missing is any connection to what this step
          # is for. The message names an absent input, not a site that
          # was never rebuilt, and the try/catch further down — which is
          # inside the script — never sees it.
          #
          # Six sibling repos dispatch across repositories: data-uk,
          # data-tr, data-jp, data-nz, data-eu-vessels and
          # data-un-vessels. Every one of them names the secret this
          # way, and this workflow was the seventh dispatcher and the
          # only one still on DEPLOY_TOKEN. That is a census, not a
          # recollection, and it is repeatable: grep every workflow in
          # every ammitto repo for createWorkflowDispatch and read the
          # secrets.* it references. Re-run it before trusting the
          # count; a repo added since will not be in it.
          github-token: ${{ secrets.AMMITTO_CI_PAT_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: 'ammitto',
                repo: 'ammitto.github.io',
                workflow_id: 'deploy.yml',
                ref: 'main'
              });
            } catch (error) {
              // Fails the step rather than logging and carrying on. The
              // empty-token case above is caught by the action before
              // this script runs, but a token that is present and
              // expired, revoked or under-scoped raises HERE, and
              // console.log left the run green: the data was published
              // and the site was never rebuilt, with nothing saying so.
              // Failing makes the run red, and that is the whole signal.
              //
              // It deliberately does NOT reach the reconciler below.
              // That step tracks the harmonization outage and keys on
              // the report harmonize wrote, so a run whose sources were
              // all healthy reads as healthy there however the dispatch
              // went. A dispatch that never fired is a different fault
              // from a source that produced nothing, and folding the
              // two onto one issue is what the reconciler exists to
              // stop.
              core.setFailed('Could not trigger deployment: ' + error.message);
            }

      # One open issue carries the state of the current outage, updated in
      # place and closed on recovery. The step this replaces created one
      # per failing run, which is how 321 open issues accumulated and
      # buried the outage they were reporting.
      #
      # `job.status` is not the input: the reconciler reads the JSON report
      # harmonize wrote, so it can say which sources failed and why rather
      # than only that something did.
      - name: Reconcile the harmonization outage issue
        if: ${{ !cancelled() && steps.reconciler_selftest.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/harmonize_issue.sh \
            "$RUNNER_TEMP/harmonize-report.json" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
